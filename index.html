  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Floating Toggle -->
    <audio id="bgMusic" src="./editable/assets/bg-music.mp3" loop preload="auto"></audio>
    <button id="musicToggleBtn" class="floating-music-toggle paused" aria-label="Toggle background music">
      <span class="music-bars">
        <span class="music-bar"></span>
        <span class="music-bar"></span>
        <span class="music-bar"></span>
        <span class="music-bar"></span>
      </span>
      <span id="musicBtnLabel">Music</span>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('bgMusic');
        const btn = document.getElementById('musicToggleBtn');
        const label = document.getElementById('musicBtnLabel');
        let isPlaying = false;

        function playAudio() {
          audio.play().then(() => {
            isPlaying = true;
            btn.classList.remove('paused');
            label.textContent = 'Music';
          }).catch(err => {
            console.log('Autoplay deferred:', err);
          });
        }

        function pauseAudio() {
          audio.pause();
          isPlaying = false;
          btn.classList.add('paused');
          label.textContent = 'Muted';
        }

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isPlaying) {
            pauseAudio();
          } else {
            playAudio();
          }
        });

        // Auto-play as soon as user opens invitation gate or interacts with page
        function startOnFirstInteraction() {
          if (!isPlaying) {
            playAudio();
          }
          document.removeEventListener('click', startOnFirstInteraction);
          document.removeEventListener('touchstart', startOnFirstInteraction);
        }
        document.addEventListener('click', startOnFirstInteraction, { passive: true });
        document.addEventListener('touchstart', startOnFirstInteraction, { passive: true });
      })();
    </script>
